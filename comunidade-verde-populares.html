<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>RóiBio | Comunidade Verde - Populares</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Meus estilos CSS -->
    <link href="dstyles.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body class="bg-gradient-droibio">

<header>



</header>

<main class="container-fluid mt-3">

<div class="mt-4 mb-4">
    <h1 class="fw-bold">
        Comunidade Verde
    </h1>
</div>

    <button class="btn btn-pill">
        Notificações <i class="ph ph-bell ms-1"></i>
    </button>

    <!-- Barra de Pesquisa-->
    <div class="row mt-4 mb-0">
        <div class="col-12">

            <!-- input-group cria a barra em formato pílula usando apenas classes oficiais -->
            <div class="input-group rounded-pill bg-white px-3 py-1 border shadow-sm align-items-center">

                <!-- Alojamento da Lupa nativa alinhada na vertical -->
                <span class="bg-transparent border-0 pe-2 text-secondary d-flex align-items-center">
                <!-- VETOR SVG OFICIAL DA LUPA DO BOOTSTRAP (Link xmlns corrigido) -->
                <svg xmlns="http://w3.org" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                </svg>
            </span>

                <!-- Campo de entrada de texto flexível e limpo -->
                <input type="text" class="form-control border-0 bg-transparent py-1 shadow-none fs-6 text-dark" placeholder="Conte-nos Coisas...">

            </div>

        </div>
    </div>

    </div>

    <!-- Bloco de Botões de Ação Lado a Lado (Centralizados e Limpos) -->
    <div class="d-flex gap-2 justify-content-center mt-3">
        <a href="#" class="btn-dbotaoverproduto text-decoration-none">Populares</a>
        <a href="#" class="btn-dbotaoverproduto text-decoration-none">Novos</a>
    </div>



    </div>


    <!-- Secção Dentuças -->
    <div class="row mt-5 mb-5">
        <div class="col-12">
            <div class="card rounded-5 overflow-hidden shadow">
                <img src="imgs/dentucas.jpg" class="card-img-top p-3 img-dimagens" alt="...">
                <div class="card-body pt-0 mt-n2">
                    <div class="d-flex align-items-start">
                        <img src="imgs/dentucas-perfil.jpg" class="rounded-circle me-3" alt="Perfil" style="width: 35px; height: 35px; object-fit: cover;">
                        <div>
                            <h5 class="fw-bold mb-1 small fs-md-6">Dentuças</h5>
                            <p class="card-text text-secondary small fs-md-6 mb-0">Comer é a melhor parte do dia!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- Secção Roinaldo -->

    <div class="row mt-5 mb-5">
    <div class="col-12">
        <h1 class="fw-bold mb-3">Popular na Comunidade</h1>
        <div class="card rounded-5 overflow-hidden shadow">
            <img src="imgs/roinaldo.jpg" class="card-img-top p-3 img-dimagens" alt="...">
            <div class="card-body pt-0 mt-n2">
                <div class="d-flex align-items-start">
                    <img src="imgs/roinaldo-perfil.jpg" class="rounded-circle me-3" alt="Perfil" style="width: 35px; height: 35px; object-fit: cover;">
                    <div>
                        <h5 class="fw-bold mb-1 small fs-md-6">Róinaldo</h5>
                        <p class="card-text text-secondary small fs-md-6 mb-0">Comer é a melhor parte do dia!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!-- Secção Luís -->
    <div class="row mt-5 mb-5">
        <div class="col-12">
            <h1 class="fw-bold mb-3">Popular na Comunidade</h1>
            <div class="card rounded-5 overflow-hidden shadow">
                <img src="imgs/luis.jpg" class="card-img-top p-3 img-dimagens" alt="...">
                <div class="card-body pt-0 mt-n2">
                    <div class="d-flex align-items-start">
                        <img src="imgs/luis-perfil.jpg" class="rounded-circle me-3" alt="Perfil" style="width: 35px; height: 35px; object-fit: cover;">
                        <div>
                            <h5 class="fw-bold mb-1 small fs-md-6">Luís</h5>
                            <p class="card-text text-secondary small fs-md-6 mb-0">Bons Momentos!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
