<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo - RóiBIO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styleLogin.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

    <div class="d-none d-lg-block w-100 h-100">
        <aside class="sidebar">
            <div class="btn-voltar mb-5 ms-3 position-absolute bottom-0 start-0" style="width: 250px;">
                <button class="btn" onclick="document.location='mainmenu.html'">Voltar</button>
            </div>
        </aside>

        <div class="register-container" id="registo">
            <main class="Quadro-registo">
                <div class="conteudo-painel" id="painel-formulario">
                    <img src="img/logoPreto.png" alt="Logo RóiBIO">

                    <div class="d-flex flex-row justify-content-between align-items-start w-100 px-4">
                        <form class="d-flex flex-column align-items-start ms-5" style="width: 50%;" onsubmit="validarRegisto(event)">
                            <h1 class="text-start" style="color:black; font-weight: bold;">Registar</h1>

                            <div class="w-100 mt-4 mb-4">
                                <input type="text" class="form-control caixapersonalizada" id="InputNomeRegisto" placeholder="Nome" required>
                            </div>
                            <div class="w-100 mb-4">
                                <input type="text" class="form-control caixapersonalizada" id="InputSobrenomeRegisto" placeholder="Sobrenome" required>
                            </div>
                            <div class="w-100 mb-4">
                                <input type="email" class="form-control caixapersonalizada" id="InputEmailRegisto" placeholder="Email" required>
                            </div>
                            <div class="w-100 mb-4">
                                <input type="password" class="form-control caixapersonalizada" id="InputPasswordRegisto" placeholder="Palavra-passe" required>
                            </div>
                            <div class="w-100 mb-4">
                                <input type="password" class="form-control caixapersonalizada" id="InputConfPasswordRegisto" placeholder="Confirmar Palavra-passe" required>
                            </div>

                            <div class="d-flex w-100 justify-content-center">
                                <button type="submit" class="btn btn-submit rounded-5 mt-3" style="background-color:#434424">Criar conta</button>
                            </div>
                        </form>

                        <div class="d-flex flex-column align-self-center align-items-center justify-content-center" style="width: 35%; margin-top: 40px;">
                            <p class="mb-3" style="color: black; font-weight: 500;">Já tem conta? <a href="login.html" style="color: black; font-weight: bold; text-decoration: underline;">Log-in</a></p>
                            <p class="mb-3" style="color: black; font-weight: bold;">Ou</p>
                            <div id="google-btn-desktop" class="mb-5"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>




    <div class="d-block d-lg-none w-100">

        
     <div class="logotopo mt-3 d-flex justify-content-center w-100 mb-2" id="logotopo">
                <img src="img/logoPreto.png" alt="Logo RóiBIO">
                    </div>

        <main class="Quadro-registo-sm px-3 py-4">
        
            <h1 class="text-center mb-4" style="color:black; font-weight: bold;">Registar</h1>

            <form class="d-flex flex-column align-items-center mx-auto" style="max-width: 90%;" onsubmit="validarRegisto(event)">
                <div class="w-100 mb-3">
                    <input type="text" class="form-control caixapersonalizada" id="InputNomeRegisto-sm" placeholder="Nome" required>
                </div>
                <div class="w-100 mb-3">
                    <input type="text" class="form-control caixapersonalizada" id="InputSobrenomeRegisto-sm" placeholder="Sobrenome" required>
                </div>
                <div class="w-100 mb-3">
                    <input type="email" class="form-control caixapersonalizada" id="InputEmailRegisto-sm" placeholder="Email" required>
                </div>
                <div class="w-100 mb-3">
                    <input type="password" class="form-control caixapersonalizada" id="InputPasswordRegisto-sm" placeholder="Palavra-passe" required>
                </div>
                <div class="w-100 mb-4">
                    <input type="password" class="form-control caixapersonalizada" id="InputConfPasswordRegisto-sm" placeholder="Confirmar Palavra-passe" required>
                </div>

             
                
                <p class="mb-2" style="color: black; font-weight: 500;">Já tem conta? <a href="login.html" style="color: black; font-weight: bold; text-decoration: underline;">Log-in</a></p>
                <p class="mb-2 fw-bold">OU</p>

                 <div id="google-btn-mobile" class="mb-5"></div>

                <button type="submit" class="btn btn-submit rounded-5 w-100 mb-3" style="background-color:#434424">Criar conta</button>
                
                <button type="button" class="btn rounded-5 w-100" style="background-color:#434424" onclick="document.location='mainmenu.html'">Voltar</button>
            </form>
        </main>
    </div>

</body>

<script>
    function validarRegisto(event) {
        event.preventDefault();

        // Tenta capturar do desktop, se estiver vazio captura do mobile
        const emailInserido = (document.getElementById('InputEmailRegisto').value || document.getElementById('InputEmailRegisto-sm').value).trim();
        const passwordInserida = document.getElementById('InputPasswordRegisto').value || document.getElementById('InputPasswordRegisto-sm').value;
        const confPasswordInserida = document.getElementById('InputConfPasswordRegisto').value || document.getElementById('InputConfPasswordRegisto-sm').value;

        if (passwordInserida !== confPasswordInserida) {
            alert('As palavras-passe não coincidem. Tente novamente.');
            return;
        }

        fetch('users.txt')
            .then(resposta => {
                if (!resposta.ok) throw new Error('Não foi possível ler a base de dados.');
                return resposta.text();
            })
            .then(texto => {
                const linhas = texto.split('\n');
                let emailJaExiste = false;

                for (let i = 0; i < linhas.length; i++) {
                    if (linhas[i].trim() === "") continue;
                    const dados = linhas[i].split(',');
                    const emailDoFicheiro = dados[0].trim();

                    if (emailInserido === emailDoFicheiro) {
                        emailJaExiste = true;
                        break;
                    }
                }

                if (emailJaExiste) {
                    alert('Este email já se encontra registado no sistema!');
                } else {
                    alert('Registo efetuado com sucesso!');
                    window.location.href = 'Sucesso.html';
                }
            })
            .catch(erro => {
                console.error('Erro na validação do registo:', erro);
                alert('Erro ao ligar ao sistema de autenticação local.');
            });
    }

    google.accounts.id.initialize({
        client_id: "488497799658-k4s673jvnukbvrcd5hiqpaliio97kgad.apps.googleusercontent.com",
        callback: tratarRespostaGoogle
    });

   window.onload = function () {
    google.accounts.id.initialize({
        client_id: "488497799658-k4s673jvnukbvrcd5hiqpaliio97kgad.apps.googleusercontent.com",
        callback: tratarRespostaGoogle
    });

    // Desenha automaticamente o botão oficial da Google nos dois ecrãs
    // Isto ignora o cooldown e funciona sempre ao clicar!
    const configBotao = { 
    theme: "outline", 
    size: "large", 
    shape: "pill",     
    width: "280",       
    locale: "pt-PT"    
};

google.accounts.id.renderButton(document.getElementById('google-btn-desktop'), configBotao);
google.accounts.id.renderButton(document.getElementById('google-btn-mobile'), configBotao);
    // Opcional: Tenta abrir também o One Tap flutuante automaticamente
    google.accounts.id.prompt();
}

    function tratarRespostaGoogle(resposta) {
        const payload = JSON.parse(atob(resposta.credential.split('.')[1]));

        console.log("Utilizador autenticado com sucesso!");
        console.log("Email vindo da Google: " + payload.email);
        console.log("Nome do Utilizador: " + payload.name);
        alert(`Bem-vindo à RóiBIO, ${payload.name}!`);
        window.location.href = 'index.html';
    }

</script>
</html>
