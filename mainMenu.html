<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo - RóiBIO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styleLogin.css">
</head>
<body>

    <div class="login-container" id="login">  

        <div class="conteudo-painel" id="botoes-login">
        <aside class="sidebar-login">
            <div class="sidebar-login-content">
                <img class="logo-menu-login" src="img/logo.png" alt="Logo RóiBIO">
                <p class="sidebar-login-text">Encontra tudo o que precisas para o teu roedor.</p>
                
                <div class="buttons-login">
                    <button class="btn" onclick="ativarLogin()">Log-in</button>
                    <button class="btn">Registar</button>
                </div>
            </div>
        </div>
        </aside>

        <main class="Quadro-login">
            <div class="conteudo-painel" id="painel-inicial">
                
                <img class="photo-login-1" src="img/photo-login-1.webp" alt="Foto 1"> 
                <img class="photo-login-2" src="img/photo-login-2.webp" alt="Foto 2"> 
                </div>
               

                <div class="conteudo-painel d-none" id="painel-formulario">
                <img src="img/logoPreto.png" alt="Logo RóiBIO">

                <form class="d-flex flex-column align-items-center mx-auto" style="max-width: 50%;"> 

                <div class="w-100 mb-3">
                <label for="InputEmailLogin" class="form-label">Email</label>
                <input type="email" class="form-control caixapersonalizada" id="InputEmailLogin">
                </div>

                <div class="w-100 mb-3">
                <label for="InputPasswordLogin" class="form-label">Palavra-passe</label>
                <input type="password" class="form-control caixapersonalizada" id="InputPasswordLogin">
                </div>

                <div class="mb-3">
                <a href="#" style="font-weight: bold; text-decoration: underline; color: black;">Esqueceu-se da Palavra-passe</a>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
</form>
            </div>
            
        </main>
    </div>  
    <script>
        function ativarLogin() {
            
            document.getElementById('login').classList.add('active-login');
            
            setTimeout(() => {
                document.getElementById('painel-inicial').classList.add('d-none');
                document.getElementById('botoes-login').classList.add('d-none');
                document.getElementById('painel-formulario').classList.remove('d-none');
            }, 0); 
        }
    </script>

</body>
</html>
