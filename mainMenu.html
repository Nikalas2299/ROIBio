<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo - RóiBIO</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="styleLogin.css">
</head>
<body>

    <aside class="sidebar-login">
        <div class="sidebar-login-content">
            <img class="logo-login" src="img/logo.png">
            <p class="sidebar-login-text">Encontra tudo o que precisas para o teu roedor.</p>
            <div class="buttons-login">
                <button class="btn" data-bs-toggle="tab" data-bs-target="#ecra-login">Log-in</button>
                <button class="btn">Registar</button>
            </div>
        </div>
    </aside>

    <main class="Quadro-login tab-content">
        
        <div class="tab-pane fade show active" id="ecra-inicial">
            <img class="photo-login-1" src="img/photo-login-1.jpg">     
            <img class="photo-login-2" src="img/photo-login-2.jpg">     
        </div>

        <div class="tab-pane fade" id="ecra-login">
            
            <div class="formulario-login">
                <h2>Log-in</h2>
                <form>
                    <input type="email" placeholder="Email">
                    <input type="password" placeholder="Palavra-passe">
                    <button type="submit" class="btn-enviar">Iniciar Sessão</button>
                </form>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
