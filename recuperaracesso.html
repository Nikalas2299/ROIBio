<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo - RóiBIO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styleLogin.css">
    <link rel="stylesheet" href="bootstrapstyle.css">
</head>

<body>

    <div class="Menu-login d-none d-lg-block" id="Menurecuperar">

        <div class="btn-voltar mb-5 ms-3 position-absolute bottom-0 start-0" style="width: 250px;" id="btn-voltar">
            <button class="btn" onclick="document.location='mainmenu.html'">Voltar</button>
        </div>

        <main class="Quadro-registo">
            <div class="conteudo-painel" id="painel-formulario">
                <img src="img/logoPreto.png" alt="Logo RóiBIO">

                <div id="formulario">
                    <h1 class="text-start ms-5 mb-5" style="color:black; font-weight: bold;">Recuperar acesso</h1>
                    <form class="recuperaremail d-flex flex-column align-items-center mx-auto" style="max-width: 50%;"
                        onsubmit="validarEmail(event); return false;">

                        <div class="w-100 mb-3 text-start px-5">
                            <label for="InputEmailRecuperar" class="form-label fw-bold">Endereço de correio eletrónico
                                da sua conta</label>
                            <input type="email" class="form-control caixapersonalizada" id="InputEmailRecuperar"
                                placeholder="Email" required>
                        </div>

                        <button type="submit" class="btn btn-submit rounded-5 mt-5"
                            style="background-color:#434424">Recuperar acesso</button>
                    </form>
                </div>

                <div class="SucessoRecuperar d-none" id="sucesso">
                    <div class="container-sucesso flex-column align-items-center mx-auto">
                        <h1 class="mb-5">Sucesso!</h1>
                        <p>Um email com instruções para recuperar o acesso foi enviado</p>
                    </div>
                    <div class="btn-voltar mt-5 mb-1 mx-auto flex-column" style="width: 250px;">
                        <button class="btn-voltarmenu btn rounded-5" style="background-color: #434424;" onclick="document.location='mainmenu.html'">Voltar
                            ao menu</button>
                    </div>
                </div>
            </div>
        </main>
    </div>


    <div class="Menu-login d-block d-lg-none w-100" id="Menurecuperar-sm">

        <div class="logotopo mt-4 d-flex justify-content-center w-100 mb-4">
            <img src="img/logoPreto.png" alt="Logo RóiBIO" style="max-width: 180px;">
        </div>

        <main class="Quadro-registo-sm px-3">
            <div class="conteudo-painel-sm">

                <div id="formulario-sm">
                    <h1 class="text-center mb-4" style="color:black; font-weight: bold;">Recuperar acesso</h1>
                    <form class="recuperaremail d-flex flex-column align-items-center mx-auto" style="max-width: 90%;"
                        onsubmit="validarEmail(event); return false;">

                        <div class="w-100 mb-4 text-start">
                            <label for="InputEmailRecuperar-sm" class="form-label fw-bold">Endereço de correio
                                eletrónico da sua conta</label>
                            <input type="email" class="form-control caixapersonalizada" id="InputEmailRecuperar-sm"
                                placeholder="Email" required>
                        </div>

                        <button type="submit" class="btn btn-submit rounded-5 w-100 mb-5"
                            style="background-color:#434424">Recuperar acesso</button>
                        <button type="button" class="btn rounded-5 w-100 mt-5" style="background-color:#434424"
                            onclick="document.location='mainmenu.html'">Voltar</button>
                    </form>


                </div>

                <div class="SucessoRecuperar d-none text-center mx-auto" id="sucesso-sm">
                    <div class="container-sucesso flex-column align-items-center mx-auto p-4 mb-4">
                        <h1 class="mb-3">Sucesso!</h1>
                        <p>Um email com instruções para recuperar o acesso foi enviado.</p>
                    </div>
                    <div class="d-flex justify-content-center w-100">
        <button class="btn rounded-5" style="background-color:#434424;"
            onclick="document.location='mainmenu.html'">Voltar ao menu</button>
                </div>

            </div>
        </main>
    </div>

</body>

<script>
    function validarEmail(event) {
        let emailIntroduzido = "";
        if (window.innerWidth >= 992) {
            emailIntroduzido = document.getElementById('InputEmailRecuperar').value.trim().toLowerCase();
        } else {
            emailIntroduzido = document.getElementById('InputEmailRecuperar-sm').value.trim().toLowerCase();
        }
        fetch('users.txt')
            .then(response => {
                if (!response.ok) {
                    throw new Error("Não foi possível aceder à base de dados de utilizadores.");
                }
                return response.text();
            })
            .then(texto => {
                const lines = texto.split('\n');
                let emailExiste = false;

                for (let linha of lines) {
                    linha = linha.trim();
                    if (linha === "") continue;

                    const partes = linha.split(',');
                    const emailFicheiro = partes[0].trim().toLowerCase();

                    if (emailFicheiro === emailIntroduzido) {
                        emailExiste = true;
                        break;
                    }
                }

                if (emailExiste) {
                    // Se for ecrã largo (Desktop)
                    if (window.innerWidth >= 992) {
                        document.getElementById('formulario').classList.add('d-none');
                        document.getElementById('btn-voltar').classList.add('d-none');
                        document.getElementById('sucesso').classList.remove('d-none');
                    } else {
                        // Se for ecrã pequeno (Mobile)
                        document.getElementById('formulario-sm').classList.add('d-none');
                        document.getElementById('sucesso-sm').classList.remove('d-none');
                    }
                } else {
                    alert("O endereço de correio eletrónico introduzido não corresponde a nenhuma conta registada.");
                }
            })
            .catch(error => {
                console.error("Erro na validação:", error);
                alert("Ocorreu um erro técnico ao processar o seu pedido. Por favor, tente novamente.");
            });
    }
</script>

</html>
